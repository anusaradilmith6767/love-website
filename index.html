<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0508">
  <title>a little something for you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pinyon+Script&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <link rel="prefetch" href="main.html">
  <style>
    :root {
      --bg: #0b0508;
      --wine: #3d0a18;
      --fg: #f3e6ea;
      --silver: #cfc2ca;
      --muted: #bd9ca8;
      --lip: #d4264b;
      --font-goth: "UnifrakturCook", "Old English Text MT", "Georgia", serif;
      --font-body: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
      --font-script: "Pinyon Script", "Snell Roundhand", cursive;
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      background: radial-gradient(ellipse at 50% 50%, var(--wine) 0%, var(--bg) 75%);
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 4vmin, 40px);
      text-align: center;
      opacity: 1;
      transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.fading {
      opacity: 0;
      pointer-events: none;
    }
    .gate-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2.4vmin, 22px);
      width: 100%;
      max-width: min(92vw, 680px);
      margin: auto;
      animation: gentleIn 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes gentleIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .subtitle {
      font-family: var(--font-script);
      font-size: clamp(1.8rem, 5.2vmin, 3.2rem);
      color: var(--silver);
      line-height: 1.1;
      letter-spacing: 0.02em;
      text-shadow: 0 0 20px rgba(207, 194, 202, 0.25);
    }
    .title {
      font-family: var(--font-goth);
      font-size: clamp(3.2rem, 11vmin, 7.8rem);
      font-weight: 700;
      line-height: 0.95;
      color: var(--fg);
      text-shadow: 0 0 45px rgba(212, 38, 75, 0.5), 0 0 15px rgba(212, 38, 75, 0.3);
      text-wrap: balance;
    }
    .seal-btn {
      margin-top: clamp(8px, 2vmin, 20px);
      width: clamp(120px, 26vmin, 185px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid var(--silver);
      outline: 1px solid rgba(207, 194, 202, 0.4);
      outline-offset: clamp(6px, 1.2vmin, 9px);
      background: radial-gradient(circle at 35% 30%, #8d1530, #4a0a18 70%);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.85), inset 0 0 30px rgba(0, 0, 0, 0.55);
      animation: pulse 2.4s ease-in-out infinite;
      padding: 0;
      transition: transform 0.25s ease, filter 0.25s ease, outline-color 0.25s ease;
      touch-action: manipulation;
    }
    .seal-btn:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 0 16px rgba(212, 38, 75, 0.7));
      outline-color: rgba(207, 194, 202, 0.7);
    }
    .seal-btn:active {
      transform: scale(0.96);
    }
    .seal-btn img {
      width: 62%;
      filter: drop-shadow(0 0 10px rgba(212, 38, 75, 0.75));
      transform: rotate(-12deg);
      pointer-events: none;
    }
    .seal-btn:focus-visible {
      outline: 3px solid var(--silver);
      outline-offset: 8px;
    }
    .tap-text {
      font-family: var(--font-body);
      font-size: clamp(0.95rem, 2vmin, 1.2rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
      display: block;
      transition: color 0.2s ease;
    }
    .seal-btn:hover + .tap-text,
    .seal-btn:focus-visible + .tap-text {
      color: var(--fg);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .seal-btn.opening {
      animation: pop 0.6s cubic-bezier(0.2, 1.4, 0.4, 1) forwards !important;
    }
    @keyframes pop {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.9; }
      100% { transform: scale(1.85); opacity: 0; }
    }
    .burst-particle {
      position: fixed;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(212, 38, 75, 0.8));
      z-index: 100;
      animation: burstOut 0.8s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
    }
    @keyframes burstOut {
      0% { opacity: 1; transform: translate(0, 0) rotate(var(--r, 0deg)) scale(0.8); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(calc(var(--r, 0deg) + 40deg)) scale(1.3); }
    }
  
    .flw-bg {
      position: absolute;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      animation: flwFloat 7s ease-in-out infinite alternate;
    }
    .glow-gold {
      filter: drop-shadow(0 0 22px rgba(255, 220, 170, 0.95))
              drop-shadow(0 0 52px rgba(255, 160, 100, 0.88))
              drop-shadow(0 0 95px rgba(212, 38, 75, 0.65));
    }
    .glow-halo {
      filter: drop-shadow(0 0 26px rgba(255, 240, 230, 0.98))
              drop-shadow(0 0 58px rgba(255, 180, 205, 0.88))
              drop-shadow(0 0 105px rgba(212, 38, 75, 0.7));
    }
    @keyframes flwFloat {
      0% { transform: rotate(var(--r, 0deg)) translate(0, 0); }
      50% { transform: rotate(calc(var(--r, 0deg) + 3deg)) translate(6px, -10px); }
      100% { transform: rotate(calc(var(--r, 0deg) - 2deg)) translate(-5px, 8px); }
    }

  </style>
</head>
<body>
    <img class="flw-bg glow-gold" style="top:-8%; left:-6%; width:clamp(200px, 32vmin, 380px); --r:-15deg; opacity:0.85;" src="img/flw_gold.png" alt="">
  <img class="flw-bg glow-halo" style="bottom:-8%; right:-6%; width:clamp(220px, 35vmin, 420px); --r:20deg; opacity:0.85;" src="img/flw_double.png" alt="">
  <main class="gate-container">
    <small class="subtitle">a little something</small>
    <h1 class="title">for you</h1>
    <button class="seal-btn" id="seal" type="button" aria-label="Open the letter">
      <img src="img/xoxo__-removebg-preview.png" alt="Kiss">
    </button>
    <span class="tap-text">tap to open</span>
  </main>

  <script>
    (function () {
      var seal = document.getElementById('seal');
      var opened = false;

      function spawnParticles(x, y) {
        var count = 14;
        for (var i = 0; i < count; i++) {
          var angle = (i / count) * 2 * Math.PI + (Math.random() - 0.5) * 0.4;
          var dist = 90 + Math.random() * 110;
          var dx = Math.cos(angle) * dist + 'px';
          var dy = Math.sin(angle) * dist + 'px';
          var img = document.createElement('img');
          img.className = 'burst-particle';
          img.src = 'img/xoxo__-removebg-preview.png';
          img.style.left = x + 'px';
          img.style.top = y + 'px';
          img.style.width = (35 + Math.random() * 30) + 'px';
          img.style.setProperty('--dx', dx);
          img.style.setProperty('--dy', dy);
          img.style.setProperty('--r', (Math.random() * 60 - 30) + 'deg');
          document.body.appendChild(img);
        }
      }

      function openLetter() {
        if (opened) return;
        opened = true;
        seal.classList.add('opening');

        var rect = seal.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        spawnParticles(cx, cy);

        setTimeout(function () {
          document.body.classList.add('fading');
        }, 150);

        setTimeout(function () {
          window.location.href = 'main.html';
        }, 520);
      }

      seal.addEventListener('click', openLetter);
      seal.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openLetter();
        }
      });
      seal.focus({ preventScroll: true });
    })();
  </script>
</body>
</html>
